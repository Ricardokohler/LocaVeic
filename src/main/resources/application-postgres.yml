spring:
  datasource:
    # Desenvolvimento local (Linux)
    url: jdbc:postgresql://localhost:5432/db_locaveics

    # Docker
    # url: jdbc:postgresql://host.docker.internal:5432/db_locaveics
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    open-in-view: true


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true